version: '3.8'
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: openmrs
      MYSQL_USER: openmrs
      MYSQL_PASSWORD: openmrs
    command: --default-authentication-plugin=mysql_native_password 
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  tomcat:
    image: tomcat:9
    volumes:
      - ./openmrs.war:/usr/local/tomcat/webapps/openmrs.war
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql-data:
